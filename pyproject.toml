[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "Reproducible coding-agent harness and inference workload laboratory"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ahl = "agentharness.cli:main"

[tool.setuptools.packages.find]
include = ["agentharness*"]
